name: CI

on:
  pull_request:
    # opened / synchronize (新しいコミットのpush) / reopened がデフォルト
    branches: [main]

# 同じPRで新しいpushがあったら、古い実行はキャンセルする
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  SIMULATOR_DESTINATION: platform=iOS Simulator,name=iPhone 17

jobs:
  build-and-test:
    name: Build & Test
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      # Deployment Target が 26.5 のため、26.x の最新の正式版Xcodeを選択する
      - name: Select Xcode
        run: |
          XCODE_APP=$(ls -d /Applications/Xcode_26*.app | grep -viE "beta|rc" | sort -V | tail -1)
          echo "Using $XCODE_APP"
          sudo xcode-select -s "$XCODE_APP"
          xcodebuild -version

      # KeychainManagerTests が実Keychainを使うため、シミュレータ既定のad-hoc署名(entitlementが付与される)でビルドする。
      # CODE_SIGNING_ALLOWED=NO を付けるとKeychainアクセスが失敗する。
      - name: Build
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project SampleGH.xcodeproj \
            -scheme SampleGH \
            -destination "$SIMULATOR_DESTINATION" \
            -derivedDataPath DerivedData

      - name: Test
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -project SampleGH.xcodeproj \
            -scheme SampleGH \
            -destination "$SIMULATOR_DESTINATION" \
            -derivedDataPath DerivedData \
            -resultBundlePath TestResults.xcresult

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults
          path: TestResults.xcresult
